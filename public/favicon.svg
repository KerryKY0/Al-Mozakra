<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDB813;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="64" cy="64" r="58" fill="#0B0D17" stroke="#FDB813" stroke-width="3" />
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="1.5" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="95" cy="50" r="1" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="100" r="1.2" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Rocket Flame -->
  <path d="M64 85 Q75 110 64 120 Q53 110 64 85" fill="#FF4500" filter="url(#glow)">
    <animate attributeName="d" values="M64 85 Q75 110 64 120 Q53 110 64 85;M64 85 Q70 105 64 115 Q58 105 64 85;M64 85 Q75 110 64 120 Q53 110 64 85" dur="0.2s" repeatCount="indefinite" />
  </path>
  <path d="M64 85 Q70 100 64 110 Q58 100 64 85" fill="#FFD700" />

  <!-- Rocket Body -->
  <path d="M64 20 C75 45 80 65 78 85 L50 85 C48 65 53 45 64 20Z" fill="url(#rocketBody)" stroke="#B8860B" stroke-width="1" />
  
  <!-- Rocket Fin Left -->
  <path d="M52 65 L40 85 L50 85 Z" fill="#DAA520" />
  
  <!-- Rocket Fin Right -->
  <path d="M76 65 L88 85 L78 85 Z" fill="#DAA520" />

  <!-- Rocket Window -->
  <circle cx="64" cy="45" r="6" fill="#0B0D17" stroke="#B8860B" stroke-width="1.5" />
</svg>
